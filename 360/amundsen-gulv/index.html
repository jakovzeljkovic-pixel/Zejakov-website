<style>
@font-face{font-family:"Montserrat";font-style:normal;font-weight:200 500;font-display:swap;src:url(/fonts/montserrat-latin-ext.woff2) format("woff2");unicode-range:U+100-2BA,U+2BD-2C5,U+2C7-2CC,U+2CE-2D7,U+2DD-2FF,U+304,U+308,U+329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Montserrat";font-style:normal;font-weight:200 500;font-display:swap;src:url(/fonts/montserrat-latin.woff2) format("woff2");unicode-range:U+0-FF,U+131,U+152-153,U+2BB-2BC,U+2C6,U+2DA,U+2DC,U+304,U+308,U+329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Shape rule: controls are full pills/circles, sheets are 14px. Copper is the only accent. */
:root{
  --ink:#121110; --text:#F4F2EE; --muted:rgba(244,242,238,.62);
  --glass:rgba(22,21,20,.46); --glass-solid:#1b1a19; --edge:rgba(255,255,255,.14);
  --accent:#D7822F; --ease:cubic-bezier(.16,1,.3,1); --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--text);font-family:Montserrat,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:3px}
#pano{position:fixed;inset:0}
.pnlm-container{background:var(--ink)!important;font-family:Montserrat,sans-serif}
.pnlm-controls-container,.pnlm-panorama-info,.pnlm-load-box,.pnlm-about-msg{display:none!important}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.22)}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--glass-solid);backdrop-filter:none;-webkit-backdrop-filter:none}}
.scrim-top,.scrim-bot{position:fixed;left:0;right:0;pointer-events:none;z-index:2}
.scrim-top{top:0;height:140px;background:linear-gradient(rgba(10,9,8,.55),rgba(10,9,8,0))}
.scrim-bot{bottom:0;height:200px;background:linear-gradient(rgba(10,9,8,0),rgba(10,9,8,.5))}

.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:max(18px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left));pointer-events:none}
.id{pointer-events:auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.id img{height:26px;width:auto;display:block}
.id .b{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:8px;pointer-events:auto}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;transition:transform .2s var(--ease),background .2s}
.ibtn:hover{background:rgba(40,38,36,.6)}
.ibtn:active{transform:scale(.94)}
.ibtn[aria-pressed=true]{background:var(--text);color:var(--ink);box-shadow:none}
.ibtn[hidden]{display:none}

.dock-wrap{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:0 16px max(18px,env(safe-area-inset-bottom));pointer-events:none}
.now{font-size:13px;font-weight:500;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.now span{color:var(--muted);font-weight:400;margin-left:8px}
.dock{pointer-events:auto;display:flex;gap:6px;padding:6px;border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
.dock::-webkit-scrollbar{display:none}
.room{position:relative;flex:0 0 auto;width:78px;height:52px;border-radius:999px;overflow:visible;scroll-snap-align:center;transition:transform .25s var(--ease)}
.room img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;opacity:.5;transition:opacity .25s}
.room::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 0 var(--text);transition:box-shadow .25s var(--ease)}
.room:hover img{opacity:.85}
.room:active{transform:scale(.96)}
.room[aria-current=true] img{opacity:1}
.room[aria-current=true]::after{box-shadow:inset 0 0 0 2px var(--text)}

.hs-nav{width:84px;height:84px;margin:-42px 0 0 -42px;cursor:pointer;perspective:220px}
.hs-nav .ring{position:absolute;inset:10px;border-radius:50%;transform:rotateX(64deg) scale(var(--k,1));border:2.5px solid rgba(255,255,255,.95);
  background:rgba(255,255,255,.16);box-shadow:0 0 0 1px rgba(0,0,0,.12),0 0 24px rgba(0,0,0,.18);transition:background .25s,transform .35s var(--ease)}
.hs-nav .ring::after{content:"";position:absolute;inset:24px;border-radius:50%;background:rgba(255,255,255,.95)}
.hs-nav:hover .ring{background:rgba(255,255,255,.34);transform:rotateX(64deg) scale(calc(var(--k,1) * 1.12))}
.hs-nav .lbl{position:absolute;left:50%;bottom:62px;transform:translate(-50%,6px);display:flex;align-items:center;gap:6px;white-space:nowrap;
  font:500 12.5px Montserrat,sans-serif;color:var(--text);padding:7px 12px 7px 10px;border-radius:999px;background:rgba(22,21,20,.66);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;transition:opacity .25s,transform .3s var(--ease);pointer-events:none}
.hs-nav .lbl i{font-size:14px}
.hs-nav:hover .lbl,.touch .hs-nav .lbl{opacity:1;transform:translate(-50%,0)}

.floor-cursor{position:fixed;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;pointer-events:none;z-index:3;perspective:200px;opacity:0;transition:opacity .2s}
.floor-cursor span{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.12);transform:rotateX(66deg) scale(var(--k,1))}
.floor-cursor.on{opacity:1}
@media (hover:none){.floor-cursor{display:none}}

/* plan: positions come from the same link yaws/pitches that place the floor rings */
.minimap{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(18px,env(safe-area-inset-bottom)) + 74px);z-index:5;width:150px;padding:10px;border-radius:var(--r);cursor:pointer}
.minimap svg,.ov svg{display:block;width:100%;height:auto;overflow:visible}
.plan-path{fill:none;stroke:rgba(244,242,238,.28);stroke-width:1.4;stroke-linecap:round}
.plan-dot{fill:var(--glass-solid);stroke:var(--text);stroke-width:1.6;cursor:pointer;transition:r .2s}
.plan-dot.on{fill:var(--accent);stroke:var(--accent)}
.plan-cone{fill:url(#coneG)}
.minimap .cap{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin:0 2px 6px}
.minimap .cap i{font-size:14px}
.ov-bg{position:fixed;inset:0;z-index:22;background:rgba(10,9,8,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .35s}
.ov{position:fixed;inset:0;z-index:23;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .35s}
.ov-open .ov-bg,.ov-open .ov{opacity:1;pointer-events:auto}
.ov .stage{width:min(980px,94vw);max-height:78vh}
.ov .tilt{transform:scale(.97);transition:transform .5s var(--ease)}
.ov-open .ov .tilt{transform:none}
.ov svg{max-height:78vh}
.plan-wall{fill:none;stroke:#EDE8E1}
.plan-floor{fill:#2b2723;stroke:none}
.plan-stair rect{fill:#34302b;stroke:rgba(237,232,225,.55);stroke-width:3}
.plan-stair path{stroke:rgba(237,232,225,.45);stroke-width:2.5;fill:none}
.plan-furn{fill:#3a3530;stroke:rgba(237,232,225,.35);stroke-width:2}
.ov .plan-path{stroke:rgba(215,130,47,.7);stroke-dasharray:3 9;stroke-linecap:round}
.ov .pin{cursor:pointer}
.ov .pin image{clip-path:circle(50%)}
.ov .pin circle{fill:none;stroke:rgba(255,255,255,.9);stroke-width:2.4}
.ov .pin.on circle{stroke:var(--accent);stroke-width:3.4}
.ov .pin text{fill:var(--text);font:500 13px Montserrat,sans-serif;text-anchor:middle;paint-order:stroke;stroke:rgba(10,9,8,.8);stroke-width:4px}
.ov .head{position:absolute;top:max(22px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:15px;font-weight:500}
.ov .head span{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:4px}
.ov .x{position:absolute;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}
@media (max-width:640px){.minimap{display:none}}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(8,7,6,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.sheet{position:fixed;z-index:21;top:12px;right:12px;bottom:12px;width:360px;border-radius:var(--r);padding:28px 24px 22px;display:flex;flex-direction:column;

.sheet .x{position:absolute;top:14px;right:14px}
.sheet .logo{height:30px;width:auto;align-self:flex-start}
.sheet .line{margin-top:22px;font-size:18px;font-weight:500;line-height:1.3}
.sheet .addr{margin-top:6px;color:var(--muted);font-size:13.5px}
.acts{margin-top:auto;display:grid;gap:10px;padding-top:28px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:999px;font-weight:500;font-size:14px;text-decoration:none;
  transition:transform .2s var(--ease),background .2s,filter .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#1a0f05}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{box-shadow:inset 0 0 0 1px var(--edge)}
.btn.ghost:hover{background:rgba(255,255,255,.06)}
.credit{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
.credit a{text-decoration:none;color:var(--text);font-weight:500}

.toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-8px);z-index:30;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .35s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bar{position:fixed;top:0;left:0;height:2px;width:100%;z-index:30;background:var(--accent);transform-origin:left;transform:scaleX(0);opacity:0;transition:opacity .4s}
.loading .bar{opacity:.9;animation:load 1.6s var(--ease) forwards}
@keyframes load{to{transform:scaleX(.85)}}
.cover{position:fixed;inset:0;z-index:25;background:var(--ink);display:grid;place-items:center;transition:opacity .7s var(--ease)}
.cover img{width:54px;height:54px;opacity:.9}
.ready .cover{opacity:0;pointer-events:none}
.hint{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;
  padding:9px 14px 9px 12px;border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .6s}
.hint i{font-size:17px}

@media (max-width:640px){
  .id img{height:22px}
  .room{width:64px;height:44px}
  .sheet{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:80dvh;transform:translateY(calc(100% + 16px))}
  .hint{bottom:132px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation:none!important}}
</style>

<script>
// Link yaw/pitch: where the next tripod spot sits on the floor in this panorama.
// Directions: inngang/lounge, prover/paneler, galleri/bildevegg, bildevegg/vegg measured from shared features
// (level-camera pose search). Distances: from overlaying the floor outlines (walls) seen from both spots.
// Rings into and out of Galleri (down a short stair) sit at the door threshold.
const TOUR = {
  first: 'inngang',
  scenes: {
    inngang:      { title: 'Inngang',     yaw: 15,   pitch: -4, links: [ { to: 'lounge', yaw: 14.5, pitch: -24 } ] },
    lounge:       { title: 'Utstilling',  yaw: -20,  pitch: -4, links: [ { to: 'inngang', yaw: -165, pitch: -24 }, { to: 'prover', yaw: 118, pitch: -26 } ] },
    prover:       { title: 'Gulvprøver',  yaw: -30,  pitch: -4, links: [ { to: 'lounge', yaw: -78, pitch: -14 }, { to: 'paneler', yaw: 0, pitch: -17.5 }, { to: 'galleri_mork', yaw: 42, pitch: -28 } ] },
    paneler:      { title: 'Prøvestativ', yaw: 80,   pitch: -4, links: [ { to: 'prover', yaw: 46, pitch: -17.5 }, { to: 'galleri_mork', yaw: 32, pitch: -28 } ] },
    galleri_mork: { title: 'Galleri',     yaw: 60,   pitch: -4, links: [ { to: 'prover', yaw: -76, pitch: -32 }, { to: 'paneler', yaw: -59, pitch: -34 }, { to: 'bildevegg', yaw: 100, pitch: -24 } ] },
    bildevegg:    { title: 'Prøvevegg',   yaw: -100, pitch: -4, links: [ { to: 'galleri_mork', yaw: -146, pitch: -24 }, { to: 'vegg', yaw: 108, pitch: -34 } ] },
    vegg:         { title: 'Plankevegg',  yaw: 40,   pitch: -4, links: [ { to: 'bildevegg', yaw: -66.5, pitch: -34 } ] }
  }
};
// heading kept across a step: yaw in B = yaw in A + offset, offset from the two mutual link yaws
const norm = a => ((a + 540) % 360) - 180;
for (const [a, s] of Object.entries(TOUR.scenes)) for (const l of s.links) {
  const back = TOUR.scenes[l.to].links.find(x => x.to === a);
  l.offset = back ? norm(back.yaw - l.yaw - 180) : null;
}
const MEASURED = { 'inngang>lounge': 0.5, 'lounge>inngang': -0.5, 'prover>paneler': -132, 'paneler>prover': 132, 'galleri_mork>bildevegg': -64, 'bildevegg>galleri_mork': 63, 'bildevegg>vegg': 5, 'vegg>bildevegg': -5 };
for (const [a, s] of Object.entries(TOUR.scenes)) for (const l of s.links) if ((a + '>' + l.to) in MEASURED) l.offset = MEASURED[a + '>' + l.to];

const ids = Object.keys(TOUR.scenes);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (matchMedia('(pointer:coarse)').matches) document.body.classList.add('touch');
const hfov0 = () => innerWidth < 640 ? 88 : 100;

function navSpot(div, l) {
  div.classList.add('hs-nav');
  div.style.setProperty('--k', Math.min(1.15, Math.max(.6, Math.abs(l.pitch) / 20)).toFixed(2));
  div.innerHTML = '<span class="ring"></span><span class="lbl"><i class="ph ph-arrow-up-right"></i><b></b></span>';
  div.querySelector('b').textContent = TOUR.scenes[l.to].title;
  div.setAttribute('role', 'button'); div.setAttribute('tabindex', '0');
  div.setAttribute('aria-label', 'Gå til ' + TOUR.scenes[l.to].title);
  const goTo = e => { e.stopPropagation(); walk(l); };
  div.addEventListener('click', goTo);
  div.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') goTo(e); });
}
const scenes = {};
for (const [id, s] of Object.entries(TOUR.scenes)) {
  scenes[id] = {
    type: 'multires', yaw: s.yaw, pitch: s.pitch, hfov: hfov0(),
    multiRes: { basePath: 'p2/' + id, path: '/%l/%s%y_%x', fallbackPath: '/fallback/%s',
                extension: 'jpg', tileResolution: 512, maxLevel: 4, cubeResolution: 2560 },
    hotSpots: s.links.map(l => ({ yaw: l.yaw, pitch: l.pitch, cssClass: 'hs', createTooltipFunc: navSpot, createTooltipArgs: l }))
  };
}
const start = location.hash.slice(1) in TOUR.scenes ? location.hash.slice(1) : TOUR.first;
const viewer = pannellum.viewer('pano', {
  default: { firstScene: start, sceneFadeDuration: reduce ? 0 : 650, autoLoad: true, showControls: false, compass: false,
             minHfov: 40, maxHfov: 115, friction: .1, mouseZoom: true, keyboardZoom: true },
  scenes
});

let busy = false;
function walk(l) {
  if (busy) return; busy = true;
  const s = TOUR.scenes[l.to], H = hfov0();
  const arrive = l.offset == null ? s.yaw : norm(viewer.getYaw() + l.offset);
  const into = () => {
    viewer.loadScene(l.to, -2, arrive, reduce ? H : H - 22);
    if (!reduce) viewer.on('load', function ease() { viewer.off('load', ease); viewer.setHfov(H, 700); });
  };
  if (reduce) return into();
  pushIn();
  viewer.lookAt(Math.max(l.pitch + 12, -6), l.yaw, Math.max(viewer.getHfov() - 34, 50), 480, into);
}
function pushIn() {
  const c = document.querySelector('#pano .pnlm-render-container');
  if (!c) return;
  c.animate([{ transform: 'scale(1)', filter: 'blur(0)' }, { transform: 'scale(1.06)', filter: 'blur(1.5px)' }],
            { duration: 520, easing: 'cubic-bezier(.4,0,.2,1)' });
}
function go(id) {
  if (busy || viewer.getScene() === id) return; busy = true;
  viewer.loadScene(id, TOUR.scenes[id].pitch, TOUR.scenes[id].yaw, hfov0());
}

const dock = document.getElementById('dock');
ids.forEach(id => {
  const b = document.createElement('button');
  b.className = 'room'; b.dataset.id = id; b.setAttribute('aria-label', TOUR.scenes[id].title); b.title = TOUR.scenes[id].title;
  b.innerHTML = `<img src="assets/thumb_${id}.jpg" alt="">`;
  b.onclick = () => go(id);
  dock.appendChild(b);
});
const now = document.getElementById('now');
function onScene() {
  const id = viewer.getScene(), i = ids.indexOf(id);
  busy = false;
  now.textContent = TOUR.scenes[id].title;
  const n = document.createElement('span'); n.textContent = (i + 1) + ' av ' + ids.length; now.append(n);
  dock.querySelectorAll('.room').forEach(b => {
    const on = b.dataset.id === id; b.setAttribute('aria-current', on);
    if (on) b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
  });
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  document.body.classList.remove('loading'); document.body.classList.add('ready');
}
viewer.on('load', onScene);
if (viewer.isLoaded()) onScene();
viewer.on('scenechange', () => document.body.classList.add('loading'));
viewer.on('error', () => { busy = false; document.body.classList.remove('loading'); });
addEventListener('keydown', e => {
  const i = ids.indexOf(viewer.getScene());
  if (e.key === ']' || e.key === 'PageDown') go(ids[(i + 1) % ids.length]);
  if (e.key === '[' || e.key === 'PageUp') go(ids[(i - 1 + ids.length) % ids.length]);
  if (e.key === 'Escape') setSheet(false);
});

const toastEl = document.getElementById('toast');
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 2200); }
async function share() {
  const url = location.href.split('#')[0] + '#' + viewer.getScene();
  if (navigator.share && document.body.classList.contains('touch')) {
    try { await navigator.share({ title: document.title, url }); } catch (e) {}
    return;
  }
  try { await navigator.clipboard.writeText(url); toast('Lenken er kopiert'); } catch (e) { prompt('Kopier lenken', url); }
}
document.getElementById('shareBtn').onclick = share;
document.getElementById('shareBtn2').onclick = share;

const rotBtn = document.getElementById('rotBtn');
rotBtn.onclick = () => { const on = rotBtn.getAttribute('aria-pressed') !== 'true';
  rotBtn.setAttribute('aria-pressed', on); on ? viewer.startAutoRotate(-2.5) : viewer.stopAutoRotate(); };
viewer.on('mousedown', () => rotBtn.setAttribute('aria-pressed', false));
viewer.on('touchstart', () => rotBtn.setAttribute('aria-pressed', false));
document.getElementById('fsBtn').onclick = () => viewer.toggleFullscreen();
viewer.on('fullscreenchange', on => { document.querySelector('#fsBtn i').className = 'ph ' + (on ? 'ph-corners-in' : 'ph-corners-out'); });
const gyroBtn = document.getElementById('gyroBtn');
setTimeout(() => { if (document.body.classList.contains('touch') && viewer.isOrientationSupported()) gyroBtn.hidden = false; }, 1500);
gyroBtn.onclick = () => { const on = gyroBtn.getAttribute('aria-pressed') !== 'true';
  gyroBtn.setAttribute('aria-pressed', on); on ? viewer.startOrientation() : viewer.stopOrientation(); };

const root = document.getElementById('sheetRoot');
function setSheet(on) { root.classList.toggle('open', on); if (on) document.getElementById('closeSheet').focus(); }
document.getElementById('infoBtn').onclick = () => setSheet(true);
document.getElementById('closeSheet').onclick = () => setSheet(false);
document.getElementById('sheetBg').onclick = () => setSheet(false);


/* Street View style: a ring follows the pointer on the floor; a click on the floor steps toward the nearest spot in that direction */
const fc = document.getElementById('fc'), panoEl = document.getElementById('pano');
let down = null;
function nearestLink(yaw) {
  const s = TOUR.scenes[viewer.getScene()]; let best = null;
  for (const l of s.links) { const d = Math.abs(norm(l.yaw - yaw)); if (d < 32 && (!best || d < best.d)) best = { l, d }; }
  return best && best.l;
}
panoEl.addEventListener('mousemove', e => {
  if (busy || e.buttons) { fc.classList.remove('on'); return; }
  const [p, y] = viewer.mouseEventToCoords(e);
  const onFloor = p < -10 && !e.target.closest('.hs-nav');
  fc.classList.toggle('on', onFloor);
  if (onFloor) { fc.style.transform = `translate(${e.clientX}px,${e.clientY}px)`; fc.style.setProperty('--k', Math.min(1.3, Math.max(.45, Math.abs(p) / 28)).toFixed(2));
                 panoEl.style.cursor = nearestLink(y) ? 'pointer' : ''; }
});
panoEl.addEventListener('mouseleave', () => fc.classList.remove('on'));
panoEl.addEventListener('mousedown', e => { down = [e.clientX, e.clientY]; });
panoEl.addEventListener('mouseup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4 || e.target.closest('.hs-nav')) return;
  const [p, y] = viewer.mouseEventToCoords(e);
  if (p < -10) { const l = nearestLink(y); if (l) walk(l); }
});


/* ---------- 2D plan ---------- */
// plan.json (tools/make_plan.py): walls traced from where each panorama's floor meets its walls, merged,
// squared to the axes and snapped to a grid so it reads as a drawn plan. Spot positions and headings come
// from the same link values as the floor rings. Indicative, not a measured drawing.
const SVGNS = 'http://www.w3.org/2000/svg';
const el = (t, a, p) => { const e = document.createElementNS(SVGNS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
let plan = null, mini = null, bigPlan = null;
const edges = [];
for (const [a, s] of Object.entries(TOUR.scenes)) for (const l of s.links) if (!edges.some(e => e[0] === l.to && e[1] === a)) edges.push([a, l.to]);
function drawPlan(svg, big) {
  const S = 100, pts = plan.outline;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]), pad = .35;
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad, W = Math.max(...xs) - x0 + pad, H = Math.max(...ys) - y0 + pad;
  svg.setAttribute('viewBox', `${x0 * S} ${y0 * S} ${W * S} ${H * S}`);
  svg.innerHTML = '';
  const defs = el('defs', {}, svg), gid = big ? 'gB' : 'gM';
  const gr = el('radialGradient', { id: gid }, defs);
  el('stop', { offset: '0', 'stop-color': '#D7822F', 'stop-opacity': '.85' }, gr); el('stop', { offset: '1', 'stop-color': '#D7822F', 'stop-opacity': '0' }, gr);
  const pat = el('pattern', { id: gid + 'p', width: S / 3, height: S / 3, patternUnits: 'userSpaceOnUse' }, defs);
  el('path', { d: `M${S / 3} 0H0V${S / 3}`, fill: 'none', stroke: 'rgba(244,242,238,.05)', 'stroke-width': 2 }, pat);
  const ww = big ? 9 : 14, sc = v => (v * S).toFixed(1);
  const outline = 'M' + plan.outline.map(p => sc(p[0]) + ',' + sc(p[1])).join('L') + 'Z';
  el('path', { d: outline, class: 'plan-floor' }, svg);
  el('path', { d: outline, fill: `url(#${gid}p)` }, svg);
  for (const f of plan.furn || []) el('rect', { x: sc(f[0]), y: sc(f[1]), width: sc(f[2] - f[0]), height: sc(f[3] - f[1]), class: 'plan-furn' }, svg);
  for (const st of plan.stairs || []) {
    const [a, b, c, d] = st.r.map(v => v * S), g = el('g', { class: 'plan-stair' }, svg);
    el('rect', { x: a, y: b, width: c - a, height: d - b }, g);
    const n = Math.max(4, Math.round((st.steps === 'h' ? d - b : c - a) / 9));
    for (let k = 1; k < n; k++) {
      if (st.steps === 'h') { const y = b + (d - b) * k / n; el('path', { d: `M${a},${y}H${c}` }, g); }
      else { const x = a + (c - a) * k / n; el('path', { d: `M${x},${b}V${d}` }, g); }
    }
  }
  if (plan.spiral) {   // spiral stair: box, quarter circle core, radial treads
    const [a, b, c, d] = plan.spiral.map(v => v * S), g = el('g', { class: 'plan-stair' }, svg);
    el('rect', { x: a, y: b, width: c - a, height: d - b }, g);
    const cx = c, cy = (b + d) / 2, R = Math.min(c - a, (d - b) / 2) * .95, r0 = R * .22;
    el('path', { d: `M${cx},${cy - R}A${R},${R} 0 0 0 ${cx},${cy + R}` }, g);
    for (let k = 0; k <= 8; k++) { const t = Math.PI / 2 + Math.PI * k / 8;
      el('path', { d: `M${cx + r0 * Math.cos(t)},${cy - r0 * Math.sin(t)}L${cx + R * Math.cos(t)},${cy - R * Math.sin(t)}` }, g); }
  }
  el('path', { d: outline, class: 'plan-wall', 'stroke-width': ww, 'stroke-linejoin': 'miter' }, svg);
  for (const w of plan.inner || []) el('path', { class: 'plan-wall', d: `M${sc(w[0])},${sc(w[1])}L${sc(w[2])},${sc(w[3])}`, 'stroke-width': ww * .8, 'stroke-linecap': 'square' }, svg);
  for (const gp of plan.gaps || []) el('path', { d: `M${sc(gp[0])},${sc(gp[1])}L${sc(gp[2])},${sc(gp[3])}`, stroke: '#2b2723', 'stroke-width': ww + 4 }, svg);
  const P = id => plan.pos[id].map(v => v * S);
  for (const pth of plan.paths || []) el('path', { class: 'plan-path', d: 'M' + pth.map(p => sc(p[0]) + ',' + sc(p[1])).join('L'), 'stroke-width': big ? 4 : 6, 'stroke-linejoin': 'round' }, svg);
  const cone = el('path', { fill: `url(#${gid})` }, svg);
  for (const id of ids) {
    const [x, y] = P(id);
    if (big) {
      const g = el('g', { class: 'pin', 'data-id': id }, svg), r = 26;
      el('image', { href: `assets/thumb_${id}.jpg`, x: x - r, y: y - r, width: 2 * r, height: 2 * r, preserveAspectRatio: 'xMidYMid slice' }, g);
      el('circle', { cx: x, cy: y, r }, g);
      el('text', { x, y: y + r + 20 }, g).textContent = TOUR.scenes[id].title;
      g.addEventListener('click', () => { setOv(false); go(id); });
    } else {
      const c = el('circle', { class: 'plan-dot', cx: x, cy: y, r: 15, 'data-id': id, 'stroke-width': 5 }, svg);
      el('title', {}, c).textContent = TOUR.scenes[id].title;
      c.addEventListener('click', e => { e.stopPropagation(); go(id); });
    }
  }
  return { cone, P, big };
}
fetch('plan.json').then(r => r.json()).then(j => {
  plan = j;
  mini = drawPlan(document.getElementById('mini'), false);
  bigPlan = drawPlan(document.getElementById('big'), true);
}).catch(() => document.getElementById('minimap').remove());
function syncPlan() {
  const id = viewer.getScene(); if (!id || !mini || !plan) return;
  for (const p of [mini, bigPlan]) {
    const [cx, cy] = p.P(id), R = p.big ? 110 : 130;
    const g = (viewer.getYaw() + plan.rot[id]) * Math.PI / 180, h = viewer.getHfov() / 2 * Math.PI / 180;
    const pt = a => [cx + R * Math.sin(a), cy - R * Math.cos(a)];
    const [ax, ay] = pt(g - h), [bx, by] = pt(g + h);
    p.cone.setAttribute('d', `M${cx},${cy}L${ax},${ay}A${R},${R} 0 0 1 ${bx},${by}Z`);
  }
  document.querySelectorAll('.plan-dot').forEach(d => d.classList.toggle('on', d.dataset.id === id));
  document.querySelectorAll('.ov .pin').forEach(d => d.classList.toggle('on', d.dataset.id === id));
}
(function loop() { if (viewer.isLoaded()) syncPlan(); requestAnimationFrame(loop); })();
const ovRoot = document.getElementById('ovRoot');
function setOv(on) { ovRoot.classList.toggle('ov-open', on); }
document.getElementById('minimap').onclick = () => setOv(true);
document.getElementById('ovBtn').onclick = () => setOv(true);
document.getElementById('ovClose').onclick = () => setOv(false);
document.getElementById('ovBg').onclick = () => setOv(false);
addEventListener('keydown', e => { if (e.key === 'Escape') setOv(false); });

const hint = document.getElementById('hint');
const hideHint = () => { hint.style.opacity = 0; setTimeout(() => hint.remove(), 700); };
document.getElementById('pano').addEventListener('pointerdown', hideHint, { once: true });
setTimeout(() => hint.isConnected && hideHint(), 6000);
</script>
