<style>
:root{--field:#14110F;--raised:#1C1815;--line:#3A332B;--cream:#EFE9DE;--muted:#9A928A;--brass:#C9A063}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--field);color:var(--cream);font-family:Montserrat,system-ui,-apple-system,sans-serif;
  min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:48px 24px calc(48px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
main{width:100%;max-width:380px;text-align:center}
.badge{width:88px;height:88px;display:block;margin:0 auto 26px}
.word{font-weight:300;font-size:22px;letter-spacing:.2em;margin-right:-.2em}
.tag span{display:block}
.tag{font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-size:19px;line-height:1.5;
  margin:34px auto 44px;opacity:.9}
nav{display:grid;gap:14px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:0 22px;
  border:1px solid var(--line);color:var(--cream);text-decoration:none;text-align:left;
  font-weight:500;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  transition:border-color .25s ease,background-color .25s ease}
.btn:hover,.btn:focus-visible{border-color:var(--brass);background:var(--raised);outline:none}
.btn span{display:flex;flex-direction:column;gap:5px}
.btn small{font-weight:300;font-size:13px;letter-spacing:.02em;text-transform:none;color:var(--muted)}
.btn i{font-style:normal;color:var(--brass);font-size:16px;letter-spacing:0}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
